<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    
    <!-- Primary Meta Tags -->
    <title>hlquery - Collections</title>
    <meta name="title" content="hlquery - Collections">
    <meta name="description" content="Professional web interface for managing, monitoring, and analyzing your HLQuery search server. Real-time analytics, collection management, and advanced search capabilities.">
    <meta name="keywords" content="hlquery, search engine, analytics, dashboard, enterprise search, data management, monitoring">
    <meta name="author" content="HLQuery Team">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hlquery.com/">
    <meta property="og:title" content="hlquery - Collections">
    <meta property="og:description" content="Professional web interface for managing, monitoring, and analyzing your HLQuery search server.">
    <meta property="og:image" content="%BASE_URL%logo.png">
    <meta property="og:site_name" content="HLQuery Analyzer">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://hlquery.com/">
    <meta property="twitter:title" content="hlquery - Collections">
    <meta property="twitter:description" content="Professional web interface for managing, monitoring, and analyzing your HLQuery search server.">
    <meta property="twitter:image" content="%BASE_URL%logo.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg">
    <link rel="alternate icon" href="%BASE_URL%favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%logo.png">
    <link rel="manifest" href="%BASE_URL%manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="msapplication-TileColor" content="#1e293b">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- Note: X-Frame-Options must be set via HTTP headers, not meta tags -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>HLQuery Analyzer requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="app">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif;">
        <div style="text-align: center;">
          <div style="width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #1976d2; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
          <p style="color: #64748b; font-size: 14px;">Loading HLQuery Analyzer...</p>
        </div>
      </div>
    </div>
    <script>
      window.HANALYZER_CONFIG = window.HANALYZER_CONFIG || {}

      ;(() => {
        if (window.location.protocol === 'file:') {
          const appRoot = document.getElementById('app')
          if (appRoot) {
            appRoot.innerHTML = `
              <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif;padding:24px;">
                <div style="max-width:720px;text-align:center;">
                  <h1 style="margin:0 0 12px;color:#0f172a;">hanalyzer must be served over HTTP</h1>
                  <p style="margin:0 0 12px;color:#475569;line-height:1.5;">
                    The production build cannot be opened directly with <code>file://</code>. Browser security blocks the JS modules and runtime config file in that mode.
                  </p>
                  <p style="margin:0;color:#475569;line-height:1.5;">
                    Start a local web server instead, for example <code>npm run preview</code> in <code>etc/hanalyzer</code>, then open the printed <code>http://</code> URL.
                  </p>
                </div>
              </div>
            `
          }
          return
        }

        fetch('%BASE_URL%hanalyzer.config.json', { cache: 'no-store' })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`config load failed: ${response.status}`)
            }
            return response.json()
          })
          .then((config) => {
            if (config && typeof config === 'object') {
              window.HANALYZER_CONFIG = {
                ...(window.HANALYZER_CONFIG || {}),
                ...config
              }
              window.dispatchEvent(new CustomEvent('hanalyzer-config-loaded', {
                detail: window.HANALYZER_CONFIG
              }))
            }
          })
          .catch(() => {
            // Optional runtime config: ignore missing or invalid deployment-specific file.
          })
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
